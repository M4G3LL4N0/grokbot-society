name: bug
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Paste real output. A claim without evidence cannot be verified or fixed.

  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead? Paste the real output.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands, smallest input that still shows it.
      render: shell
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Runtime versions
      placeholder: "node v24.x, pnpm 10.x"
    validations:
      required: true
