name: feature
description: Propose a capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
    validations:
      required: true

  - type: textarea
    id: tradeoff
    attributes:
      label: Trade-off
      description: What gets worse if this lands?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps the runtime provider-neutral
          required: true
        - label: This can be covered by a test that would have caught a real defect
          required: true
